networks:
  appnet:
    name: appnet

services:
  db:
    image: postgres:16-alpine
    networks: [appnet]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rankvault
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: runner
      network: host
      args:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rankvault
    networks: [appnet]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rankvault
      NEXTAUTH_SECRET: docker-local-test-secret-not-for-prod
      NEXTAUTH_URL: http://localhost:3001
      # Optional — login won't work without these, everything else will:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3001:3000"

  web-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    networks: [appnet]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rankvault
      NEXTAUTH_SECRET: docker-local-test-secret-not-for-prod
      NEXTAUTH_URL: http://localhost:3001
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
      network: host
      args:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rankvault
    networks: [appnet]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rankvault
      NEXTAUTH_SECRET: docker-local-test-secret-not-for-prod
      NEXTAUTH_URL: http://localhost:3001

volumes:
  db-data:
